# Минимальный стартовый пакет
# Список ID политик, входящих в пакет

pack:
  id: minimum-starter
  title: Минимальный стартовый пакет
  description: |
    Базовый набор политик, покрывающий 80% типовых рисков для большинства
    организаций. Стартовая точка для компании любого размера.
  estimated_implementation_months: 3-6
  target_audience: |
    Любая организация, ещё не имеющая формализованной IT-документации
    либо желающая обновить устаревшую базу.

policies:
  # Метаполитики (этап 0)
  - id: POL-MTA-001
    rationale: Без правил написания политик невозможно поддерживать остальные
  - id: POL-MTA-002
    rationale: Без формального процесса исключений вся система деградирует

  # Стратегия (этап 0)
  - id: POL-GOV-001
    rationale: Зонтичный документ, на который ссылаются все остальные

  # Управление доступом (этап 1)
  - id: POL-IAM-001
    rationale: Базовый контроль входа в системы
  - id: POL-IAM-002
    rationale: Пароли без MFA - неполноценная защита в 2026
  - id: POL-IAM-003
    rationale: Принципы least privilege и need-to-know
  - id: POL-IAM-005
    rationale: Жизненный цикл учётных записей - типовой источник проблем
  - id: POL-IAM-008
    rationale: NHI и секреты - один из топ-векторов атак сегодня

  # Данные (этап 1)
  - id: POL-DAT-001
    rationale: Классификация и базовые меры защиты по категориям
  - id: POL-DAT-002
    rationale: Защита от потери данных - первостепенная задача

  # Реагирование и операции (этап 1)
  - id: POL-SEC-001
    rationale: Когда инцидент случится, должна быть готова процедура
  - id: POL-OPS-001
    rationale: Неконтролируемые изменения - источник большинства аварий
  - id: POL-OPS-014
    rationale: Единая дисциплина именования - база для всего остального

  # Сервис (этап 1)
  - id: POL-SVC-001
    rationale: Без каталога сервисов IT не может корректно их обслуживать

  # Персонал (этап 1)
  - id: POL-HRM-001
    rationale: Базовое соглашение с сотрудниками о допустимом использовании

# Условные дополнения (применять, если применимо)
conditional_additions:
  - id: POL-SUP-005
    when: "Если есть подрядчики с доступом к IT-ресурсам"
    rationale: Подрядчики - частая причина утечек

# Что НЕ входит и почему
explicit_exclusions:
  - domain: разработка ПО
    reason: Только для разработчиков; см. пакет software-development
  - domain: облако
    reason: Только для облачных; см. пакет cloud-first
  - domain: РФ-специфика
    reason: Зависит от регуляторного контекста; см. 152-fz-aligned и kii-subject
