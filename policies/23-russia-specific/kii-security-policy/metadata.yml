id: POL-RUS-001
title: Политика обеспечения безопасности объектов критической информационной инфраструктуры
slug: kii-security-policy
domain: 23-russia-specific
version: 1.0
status: draft
maturity: standard
conditional: true
typical_owner: CISO
last_reviewed: 2026-10-03
review_cycle_months: 12

short_title: Безопасность КИИ

applicability_notes: |
  Применима исключительно для субъектов критической информационной инфраструктуры (КИИ) —
  организаций, осуществляющих деятельность в одной из 12 сфер, определённых ФЗ-187 ст. 2:
  здравоохранение, наука, транспорт, связь, энергетика, банки и финансы, ТЭК,
  атомная энергетика, оборонная промышленность, ракетно-космическая, горнодобывающая,
  металлургическая и химическая промышленность. Организации, не относящиеся к субъектам КИИ,
  эту политику не применяют.

