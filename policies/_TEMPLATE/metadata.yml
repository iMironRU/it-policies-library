# ═══════════════════════════════════════════════════════════════════════
# ЭТАЛОННЫЕ МЕТАДАННЫЕ — ОБРАЗЕЦ СО ВСЕМИ ПОЛЯМИ
# ═══════════════════════════════════════════════════════════════════════
# При создании новой политики:
# - Скопируйте этот файл в папку новой политики как metadata.yml
# - Заполните все ОБЯЗАТЕЛЬНЫЕ поля
# - Заполните ЖЕЛАТЕЛЬНЫЕ поля по возможности
# - Удалите комментарии-подсказки в готовом файле, оставьте только данные
# - Прогоните через tools/validate-metadata.py
# ═══════════════════════════════════════════════════════════════════════

# ─── ОБЯЗАТЕЛЬНЫЕ ПОЛЯ ────────────────────────────────────────────────

id: POL-XXX-000                  # ID шаблона. Формат: POL-<3-letter-domain>-<3-digit-number>
                                 # Префиксы доменов — см. CLAUDE.md → Идентификаторы шаблонов
                                 # Номер выдаётся мейнтейнером при ревью Issue

title: Название политики         # Полное название на русском. С заглавной буквы.
                                 # Без точки в конце. Без слова "шаблон".

slug: policy-slug                # Имя папки и URL-фрагмент. lowercase-hyphenated.
                                 # Должен совпадать с именем папки.

domain: 99-domain-folder         # Имя папки-домена. Должно совпадать с реальной папкой.

version: 0.1                     # SemVer (major.minor). Начинаем с 0.1 для draft.
                                 # 1.0 — после первого ревью и перехода в active.

status: draft                    # draft | review | active | deprecated
                                 # draft — в работе, не для использования
                                 # review — готов, в ревью
                                 # active — готовый, рекомендуется
                                 # deprecated — устаревший

maturity: standard               # core | standard | advanced
                                 # core — базовый уровень (★, нужен почти всем)
                                 # standard — средний (◆, средний/крупный бизнес)
                                 # advanced — продвинутый (▲, зрелые/регулируемые)

conditional: false               # true — шаблон условный (ⓘ, применяется только при определённых условиях)
                                 # false — общеприменимый

typical_owner: CISO              # Типичная роль-владелец документа
                                 # Примеры: CISO, CIO, CTO, Compliance Officer,
                                 # Руководитель IT-инфраструктуры, Engineering Lead

last_reviewed: 2026-05-11        # Дата последнего ревью этого шаблона. ISO-формат.
review_cycle_months: 12          # Через сколько месяцев нужен следующий пересмотр.
                                 # По умолчанию 12.

# ─── ЖЕЛАТЕЛЬНЫЕ ПОЛЯ ─────────────────────────────────────────────────

short_title: Короткое название   # Для индексов и графа зависимостей.
                                 # 1-3 слова. Если основное title уже короткое — можно пропустить.

applicability_notes: |           # Заполнять, если conditional: true
  Описание условий, при которых
  шаблон применим. Несколько строк OK.

depends_on:                      # ID шаблонов, которые должны быть внедрены ДО этого
  - POL-XXX-000                  # Указывайте по ID. Пустой список [] если нет зависимостей.

related_to:                      # ID шаблонов, с которыми этот связан "по горизонтали"
  - POL-XXX-000                  # Не обязательно "до". Просто связанные.

supersedes: []                   # ID шаблонов, которые этот заменил (если такие есть)
superseded_by: null              # ID шаблона, который заменил этот (для deprecated)

regulatory_refs:                 # Маппинг на регуляторные требования и стандарты
  - "ISO/IEC 27001:2022 — A.X.X"
  - "NIST CSF 2.0 — XX.XX-XX"
  - "ФЗ-152 — ст. X"
  - "ФСТЭК Приказ 17 — XXX.X"
  - "CIS Controls v8 — X.X"

packs:                           # В какие готовые наборы входит этот шаблон
  - minimum-starter              # Имена соответствуют папкам в packs/

tags:                            # Теги для поиска и фильтрации
  - example-tag
  - another-tag

authors:                         # Первоначальные авторы
  - iMironRU
contributors:                    # Все, кто значимо контрибьютил (включая автора)
  - iMironRU

# ─── ОПЦИОНАЛЬНЫЕ ПОЛЯ ────────────────────────────────────────────────

# Сигналы качества (опционально, заполняет мейнтейнер при ревью)
quality_signals:
  industry_adoption: medium      # low | medium | high — насколько распространена в индустрии
  template_completeness: draft   # draft | tested | production-ready
  examples_available: false      # есть ли в EXAMPLES/ что-то полезное

# Внешние ссылки на источники, на которых основан шаблон
external_references:
  - title: "Название источника"
    url: "https://..."
    note: "Что взято / на что опирались"
